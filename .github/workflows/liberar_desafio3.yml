name: Santillana - Liberar Desafio 3

on:
  schedule:
    - cron: '0 09 15 6 *'
  workflow_dispatch:

jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Rodar liberação
        run: python liberar_desafio3.py
        env:
          URL: ${{ secrets.URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASS: ${{ secrets.PASS }}